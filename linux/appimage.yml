version: 1

script:
  - rm -rf AppDir || true
  - mkdir -p AppDir

  - cp -r ../build/linux/x64/release/bundle/* AppDir/

  - mkdir -p AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders
  - cp /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-svg.so AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/

  - mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps
  - cp ../assets/images/logo.png AppDir/usr/share/icons/hicolor/64x64/apps/logo.png

AppDir:
  path: AppDir
  app_info:
    id: com.gr3gorywolf.yamata-launcher
    name: Yamata Launcher
    icon: logo
    version: latest
    exec: yamata_launcher
    exec_args: $@

  apt:
    arch: amd64
    allow_unauthenticated: true

    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
      - sourceline: deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

    include:
      # GTK
      - libgtk-3-0
      - libglib2.0-0
      - libgdk-pixbuf2.0-0
      - libgdk-pixbuf2.0-bin
      - librsvg2-2

      # Wayland / input
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0

      # Tray support
      - libayatana-appindicator3-1
      - libayatana-indicator3-7
      - libayatana-ido3-0.4

      # browser
      - webkit2gtk-4.1

    exclude:

      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono


      - gvfs
      - gvfs-common
      - dconf-service
      - libdconf1

      - python3
      - python3-minimal
      - perl

      - libgl1-mesa-dri
      - libglx-mesa0
      - libegl-mesa0


  runtime:
    env:
      GDK_BACKEND: x11
      GDK_PIXBUF_MODULEDIR: $APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders
      GDK_PIXBUF_MODULE_FILE: $APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
      GIO_USE_VFS: local
      GIO_EXTRA_MODULES: ""
      GTK_USE_PORTAL: "0"


AppImage:
  arch: x86_64
  update-information: guess